<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="calculator">
        <div class="display">
          <div class="expression" id="expression"></div>
          <div class="result" id="result">0</div>
        </div>
        <div class="buttons" id="buttons">
          <button class="btn btn-clear span-two" data-action="clear" aria-label="Clear">
            C
          </button>
          <button class="btn btn-action" data-action="delete" aria-label="Delete last character">DEL</button>
          <button class="btn btn-operator" data-value="/" aria-label="Divide">÷</button>

          <button class="btn" data-value="7">7</button>
          <button class="btn" data-value="8">8</button>
          <button class="btn" data-value="9">9</button>
          <button class="btn btn-operator" data-value="*" aria-label="Multiply">×</button>

          <button class="btn" data-value="4">4</button>
          <button class="btn" data-value="5">5</button>
          <button class="btn" data-value="6">6</button>
          <button class="btn btn-operator" data-value="-" aria-label="Subtract">−</button>

          <button class="btn" data-value="1">1</button>
          <button class="btn" data-value="2">2</button>
          <button class="btn" data-value="3">3</button>
          <button class="btn btn-operator" data-value="+" aria-label="Add">+</button>

          <button class="btn btn-action" data-value="%" aria-label="Modulo">%</button>
          <button class="btn" data-value="0">0</button>
          <button class="btn" data-value=".">.</button>
          <button class="btn btn-equal" data-action="calculate" aria-label="Equals">=</button>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
